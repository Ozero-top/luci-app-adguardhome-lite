<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>正在跳转 · AdGuard Home 管理中心</title>
<meta name="description" content="正在跳转到 AdGuard Home 管理中心站点。">
<meta name="robots" content="noindex,follow">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#171b20" media="(prefers-color-scheme:dark)">
<meta name="theme-color" content="#f4f6f3" media="(prefers-color-scheme:light)">
<link rel="canonical" href="https://agh.ozero.asia/">
<link rel="dns-prefetch" href="//agh.ozero.asia">
<link rel="preconnect" href="https://agh.ozero.asia" crossorigin>
<meta http-equiv="refresh" content="1;url=https://agh.ozero.asia/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0d0f'/%3E%3Cpath d='M32 12l14 6v11c0 10-6 17-14 20-8-3-14-10-14-20V18z' fill='none' stroke='%236ee7a9' stroke-width='3'/%3E%3Cpath d='m25 31 5 5 9-10' fill='none' stroke='%236ee7a9' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#171b20;
  --line:rgba(255,255,255,.11);
  --text:#f0f3f0;--muted:#aab4ae;--dim:#8b968f;
  --accent:#6ee7a9;--accent-soft:rgba(110,231,169,.10);--accent-line:rgba(110,231,169,.30);
  --grid:rgba(255,255,255,.05);
  --sans:"Inter","SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --ease:cubic-bezier(.22,.61,.36,1);
}
@media (prefers-color-scheme:light){
  :root{
    --bg:#f4f6f3;
    --line:rgba(18,40,28,.10);
    --text:#14221a;--muted:#56655d;--dim:#5f6e66;
    --accent:#0b7f52;--accent-soft:rgba(11,127,82,.08);--accent-line:rgba(11,127,82,.26);
    --grid:rgba(16,45,30,.06);
  }
}
html,body{height:100%}
body{
  font-family:var(--sans);background:var(--bg);color:var(--text);
  overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
.boot-page{
  position:fixed;inset:0;z-index:10;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(700px 340px at 50% 50%,var(--accent-soft),transparent 70%),var(--bg);
  opacity:1;visibility:visible;transition:opacity .16s var(--ease),visibility .16s;
}
.boot-page.done{opacity:0;visibility:hidden;pointer-events:none}
.boot-page::before{
  content:"";position:absolute;inset:0;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:48px 48px;opacity:.35;
  -webkit-mask-image:radial-gradient(ellipse 55% 55% at 50% 50%,#000,transparent 78%);
  mask-image:radial-gradient(ellipse 55% 55% at 50% 50%,#000,transparent 78%);
}
.boot-page::after{
  content:"";position:absolute;left:0;right:0;top:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
  opacity:.55;box-shadow:0 0 18px var(--accent-line);animation:bootScan .9s linear infinite;
}
@keyframes bootScan{from{transform:translateY(0)}to{transform:translateY(100vh)}}
.boot-glow{
  position:absolute;left:50%;top:50%;width:760px;height:380px;margin:-190px 0 0 -380px;
  background:radial-gradient(ellipse at center,var(--accent-soft),transparent 68%);
  pointer-events:none;z-index:0;animation:bootGlow 1.6s ease-in-out infinite;
}
@keyframes bootGlow{0%,100%{transform:scale(.9);opacity:.6}50%{transform:scale(1.08);opacity:1}}
.boot-ripples{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none;z-index:1}
.boot-ripples i{
  position:absolute;left:0;top:0;width:180px;height:180px;margin:-90px 0 0 -90px;
  border:1px solid var(--accent-line);border-radius:50%;box-shadow:0 0 26px var(--accent-soft);
  opacity:0;animation:bootRipple 1.2s var(--ease) infinite;
}
.boot-ripples i:nth-child(1){animation-delay:-.1s}
.boot-ripples i:nth-child(2){animation-delay:-.4s}
.boot-ripples i:nth-child(3){animation-delay:-.7s}
.boot-ripples i:nth-child(4){animation-delay:-1s}
@keyframes bootRipple{0%{transform:scale(.3);opacity:0}10%{opacity:.55}55%{opacity:.18}100%{transform:scale(3.4);opacity:0}}
.boot{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:14px;width:min(86vw,344px)}
.boot-mark{
  position:relative;width:64px;height:64px;display:grid;place-items:center;
  border:1px solid var(--accent-line);border-radius:18px;
  background:linear-gradient(160deg,var(--accent-soft),transparent);color:var(--accent);
}
.boot-mark svg{width:30px;height:30px}
.boot-mark::after{content:"";position:absolute;inset:-8px;border:1px solid var(--accent-line);border-radius:24px;animation:bootRing .9s var(--ease) infinite}
@keyframes bootRing{0%{transform:scale(.92);opacity:.7}70%{transform:scale(1.08);opacity:0}100%{opacity:0}}
.boot-name{font-size:15px;font-weight:700;letter-spacing:.01em}
.boot-sub{font-family:var(--mono);font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.boot-status{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:5px;font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;color:var(--muted)}
.boot-status b{color:var(--accent);font-weight:500}
.boot-bar{width:100%;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.boot-bar i{display:block;width:0;height:100%;border-radius:2px;background:linear-gradient(90deg,var(--accent-line),var(--accent));box-shadow:0 0 10px var(--accent-line)}
.boot-link{
  margin-top:2px;font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;color:var(--dim);
  text-decoration:none;border-bottom:1px solid transparent;transition:color .2s,border-color .2s;
}
.boot-link:hover,.boot-link:focus-visible{color:var(--accent);border-bottom-color:var(--accent-line)}
@media (prefers-reduced-motion:reduce){
  .boot-page::after,.boot-mark::after,.boot-glow,.boot-ripples i{animation:none}
  .boot-ripples{display:none}
}
</style>
</head>
<body>
<div class="boot-page" id="bootPage">
  <div class="boot-glow" aria-hidden="true"></div>
  <div class="boot-ripples" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <div class="boot">
    <div class="boot-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5.4c0 4.5-2.9 7.7-7 9.1-4.1-1.4-7-4.6-7-9.1V6z"/><path d="m9.2 12 1.9 1.9 3.7-3.9"/></svg>
    </div>
    <div class="boot-name">AdGuard Home 管理中心</div>
    <div class="boot-sub">OpenWrt / LuCI</div>
    <div class="boot-status"><span id="bootStatus">载入界面资源</span><b id="bootPct">0%</b></div>
    <div class="boot-bar"><i id="bootBar"></i></div>
    <a class="boot-link" id="bootLink" href="https://agh.ozero.asia/">没有自动跳转？点此进入 agh.ozero.asia</a>
  </div>
</div>

<noscript>
  <div style="position:fixed;inset:0;display:grid;place-items:center;font-family:system-ui,sans-serif;background:#171b20;color:#f0f3f0">
    <p>正在跳转到 <a href="https://agh.ozero.asia/" style="color:#6ee7a9">agh.ozero.asia</a> …</p>
  </div>
</noscript>

<script>
(function(){
  var TARGET='https://agh.ozero.asia/';
  var DURATION=420;
  var HOLD=0;
  var FADE=80;
  var page=document.getElementById('bootPage');
  var bar=document.getElementById('bootBar');
  var pct=document.getElementById('bootPct');
  var status=document.getElementById('bootStatus');
  var steps=[[0,'载入界面资源'],[55,'转向主站 agh.ozero.asia']];
  var finished=false;

  function go(){
    if(finished)return;
    finished=true;
    if(page)page.classList.add('done');
    window.setTimeout(function(){window.location.replace(TARGET);},FADE);
  }

  function labelFor(percent){
    var label=steps[0][1];
    for(var i=0;i<steps.length;i++){if(percent>=steps[i][0])label=steps[i][1];}
    return label;
  }

  function tick(now){
    var progress=Math.min(1,(now-start)/DURATION);
    var eased=1-Math.pow(1-progress,3);
    var percent=eased*100;
    if(bar)bar.style.width=percent+'%';
    if(pct)pct.textContent=Math.round(percent)+'%';
    var label=labelFor(percent);
    if(status&&status.textContent!==label)status.textContent=label;
    if(progress<1)window.requestAnimationFrame(tick);
    else window.setTimeout(go,HOLD);
  }

  var start=window.performance&&performance.now?performance.now():Date.now();
  if(window.requestAnimationFrame)window.requestAnimationFrame(tick);
  else window.setTimeout(go,DURATION+HOLD+FADE);

  window.setTimeout(go,1500);
})();
</script>
</body>
</html>
