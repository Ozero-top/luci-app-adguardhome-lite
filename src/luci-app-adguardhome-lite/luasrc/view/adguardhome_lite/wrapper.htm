<%+header%>
<div class="agh-frame-wrap">
	<iframe id="agh-frame" src="<%=url([[admin]], [[services]], [[adguardhome_lite]], [[frame]])%>" title="AdGuard Home 助手" scrolling="no" loading="eager"></iframe>
</div>
<style>
	.agh-frame-wrap {
		width: 100%;
		margin: 0;
		padding: 0;
	}
	#agh-frame {
		display: block;
		width: 100%;
		height: 600px;
		min-height: 0;
		border: 0;
		border-radius: 8px;
		background: #f3eddf;
		overflow: hidden;
	}
	@media (max-width: 800px) {
		#agh-frame {
			height: 480px;
		}
	}
</style>
<script>
	(function () {
		var frame = document.getElementById('agh-frame');
		if (!frame) return;

		// iframe 自身底色跟随插件主题，避免内页加载前闪一下浅色
		function syncFrameBg() {
			var theme = '';
			try { theme = localStorage.getItem('agh-theme') || ''; } catch (e) { /* 忽略 */ }
			if (theme !== 'dark' && theme !== 'light') {
				theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
			}
			frame.style.background = theme === 'dark' ? '#141517' : '#f3eddf';
		}

		frame.addEventListener('load', syncFrameBg);
		window.addEventListener('storage', syncFrameBg);
		syncFrameBg();
	})();
</script>
<script>
	(function () {
		var frame = document.getElementById('agh-frame');
		if (!frame) return;
		var lastHeight = 0;

		function setHeight(height) {
			height = Math.max(Math.ceil(height || 0), 320);
			if (Math.abs(height - lastHeight) > 1) {
				lastHeight = height;
				frame.style.height = height + 'px';
			}
		}

		function fitFrame() {
			try {
				var doc = frame.contentDocument || frame.contentWindow.document;
				if (!doc || !doc.documentElement) return;

				// 隐藏 iframe 内部页面滚动条，滚动交给外层 LuCI 主题
				doc.documentElement.style.overflow = 'hidden';
				if (doc.body) doc.body.style.overflow = 'hidden';

				var app = doc.querySelector('.agh-app');
				var height = app
					? Math.ceil(app.getBoundingClientRect().height)
					: (doc.body ? (doc.body.scrollHeight || 0) : 0);
				setHeight(height);
			} catch (e) {}
		}

		// 内页通过 postMessage 上报高度，避免每秒轮询 iframe DOM
		window.addEventListener('message', function (e) {
			if (e.origin !== window.location.origin || e.source !== frame.contentWindow) return;
			var data = e.data || {};
			if (data.type === 'agh-height' && data.height) setHeight(data.height);
		});

		frame.addEventListener('load', fitFrame);
		window.addEventListener('resize', fitFrame);
		fitFrame();
	})();
</script>
<%+footer%>
