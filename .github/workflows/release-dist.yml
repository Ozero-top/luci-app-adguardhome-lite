name: release-dist

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-dist:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: 下载 Release 资产
        run: |
          set -e
          if [ -z "$TAG" ]; then
            TAG=$(gh release view --json tagName -q .tagName)
            echo "TAG=$TAG" >> "$GITHUB_ENV"
          fi
          mkdir -p assets
          gh release download "$TAG" -D assets --clobber

      - name: 同步到 dist 分支
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rm -rf /tmp/agh-dist
          if git ls-remote --heads "$remote" dist | grep -q dist; then
            git clone --branch dist --depth 1 "$remote" /tmp/agh-dist
          else
            git clone --depth 1 "$remote" /tmp/agh-dist
            cd /tmp/agh-dist
            git checkout --orphan dist
          fi
          cd /tmp/agh-dist
          git rm -rf . >/dev/null 2>&1 || true
          cp "$GITHUB_WORKSPACE"/assets/* .
          git add -A
          git commit -m "dist: $TAG" || exit 0
          git push origin dist
